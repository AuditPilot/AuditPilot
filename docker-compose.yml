services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        # Empty => same-origin (nginx proxies /api below).
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: auditpilot-web:latest
    ports:
      # host 4173 — :3000 is often taken by other dev tooling
      - "4173:80"
    environment:
      - API_UPSTREAM=${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
