# Static client hosting ONLY — the API is a self-hosted process
# (see ../AuditPilot-API). Netlify serves dist/public and
# rewrites all paths to the SPA entry; /api calls go to the API origin
# (client embeds it via VITE_API_BASE).

[build]
  command = "npm run build"
  publish = "dist/public"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
